# AlpaNet BEV multi-hypothesis driver configuration for AlpaSim.
# Reference as: driver=alpanet when calling alpasim_wizard.

defaults:
  - student_camera_configs    # 4-camera global simulation spec
  - _self_

log_level: ${wizard.log_level}

model:
  model_type: alpanet
  # Updated automatically by dagger/loop.py after each training iteration.
  checkpoint_path: "/mnt/checkpoints/alpanet_iter_19_best.pth"
  device: "cuda"
  # NRE UUID for camera calibration lookup.  Leave empty to auto-discover
  # from dagger_run* directories on the host.
  nre_uuid: ""

host: "0.0.0.0"
port: ???

inference:
  use_cameras:
    - camera_cross_left_120fov
    - camera_front_wide_120fov
    - camera_cross_right_120fov
    - camera_front_tele_30fov
  max_batch_size: 4
  subsample_factor: 1
  context_length: 1

route:
  use_waypoint_commands: false

output_dir: "/mnt/output/driver"

trajectory_optimizer:
  enabled: false

plot_debug_images: false
