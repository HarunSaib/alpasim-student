# Student driver configuration for AlpaSim.
# Reference as: driver=student when calling alpasim_wizard.

defaults:
  - student_camera_configs    # 4-camera global simulation spec (mirrors alpamayo_configs)
  - _self_

log_level: ${wizard.log_level}

model:
  model_type: student
  # Updated automatically by dagger/loop.py after each training iteration.
  # Set manually for standalone runs.
  checkpoint_path: "/mnt/checkpoints/student_iter_5.pth"
  device: "cuda"

host: "0.0.0.0"
port: ???

inference:
  use_cameras:
    - camera_cross_left_120fov
    - camera_front_wide_120fov
    - camera_cross_right_120fov
    - camera_front_tele_30fov
  max_batch_size: 8
  subsample_factor: 1
  context_length: 1    # single-frame model

route:
  use_waypoint_commands: false

output_dir: "/mnt/output/driver"

trajectory_optimizer:
  enabled: false

plot_debug_images: false
